server {
    listen 8080;  # nginx-unprivileged (nie-root) nie może bindować <1024
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # zakładka „Co dziś” usunięta — stare linki na kolejkę
    location = /dzis {
        return 301 /kolejka$is_args$args;
    }

    # PERF-005: Vite nadaje plikom w /assets/ hash w nazwie (index-C1Cl-AZP.js) — nowa wersja
    # to nowa nazwa, więc przeglądarka może je trzymać rok bez pytania serwera. Brak pliku
    # = 404 (nie index.html), żeby HTML nie trafił do cache pod nazwą skryptu.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html wskazuje aktualne nazwy assetów — zawsze rewalidowany (ETag), inaczej po
    # wdrożeniu przeglądarka ładowałaby stary panel. Trafiają tu też trasy SPA (try_files niżej).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # te same nagłówki co SecurityHeadersMiddleware w backend/app/main.py (SEC-011;
        # zgodność pilnuje backend/tests/test_security_headers.py). /api/ ma je z backendu.
        # Bez HSTS: panel dev stoi na HTTP.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-pEJ1bymT5vJsOU8RhaGP0EnWFUSw1qZ0YdjuVP/1GyA='; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
