  /dostawcy/:id:          {admin: true, logistics: true, warehouse: true, forwarder: true, customs: true, purchasing: true}   # bez guarda (stan obecny; brak decyzji — zakres pilnuje API)
  /brama:                 {admin: true, logistics: true, warehouse: true, forwarder: false, customs: false, purchasing: false}
  /awizacje/propozycje:   {admin: true, logistics: true, warehouse: false, forwarder: false, customs: false, purchasing: false}
  /zlecenia-spedycyjne:   {admin: true, logistics: true, warehouse: false, forwarder: false, customs: false, purchasing: false}
  /specjalna-troska:      {admin: true, logistics: true, warehouse: false, forwarder: false, customs: false, purchasing: false}
  /wywolania-dlt:         {admin: true, logistics: true, warehouse: true,  forwarder: false, customs: false, purchasing: false}
  /analityka:             {admin: true, logistics: true, warehouse: false, forwarder: false, customs: false, purchasing: false}
  /dziennik-zmian:        {admin: true, logistics: true, warehouse: false, forwarder: false, customs: false, purchasing: false}
  /master-data:           {admin: true, logistics: true, warehouse: false, forwarder: false, customs: false, purchasing: false}
  /koszyk:                {admin: true, logistics: true, warehouse: false, forwarder: false, customs: false, purchasing: true}
  /kalendarz:             {admin: true, logistics: true, warehouse: true, forwarder: true, customs: false, purchasing: false}
  /sledzenie:             {admin: true, logistics: true, warehouse: true, forwarder: true, customs: false, purchasing: false}
  /reklamacje:            {admin: true, logistics: true, warehouse: true, forwarder: true, customs: false, purchasing: false}
  /zamowienia:            {admin: true, logistics: true, warehouse: false, forwarder: true, customs: false, purchasing: true}   # decyzja 2026-09-26: forwarder TAK (brak linku w menu = B-006)
  /spedycja:              {admin: true, logistics: true, warehouse: false, forwarder: true, customs: false, purchasing: true}
  /wyceny:                {admin: true, logistics: true, warehouse: false, forwarder: true, customs: false, purchasing: false}
  /odprawa:               {admin: true, logistics: true, warehouse: false, forwarder: false, customs: false, purchasing: false}  # customs dostaje odprawę pod /kolejka
  /administracja:         {admin: true, logistics: false, warehouse: false, forwarder: false, customs: false, purchasing: false}

# Stare adresy → przekierowanie (routing.tsx:10-26); query i parametry zachowane
