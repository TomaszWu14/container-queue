# Widoczność UI TIMPORYE per rola — ETAP 0, SZKIC do akceptacji.
# Źródło: analiza frontend/src (routing.tsx canAccess, Sidebar.tsx, sections.ts, warunki user.role)
# na origin/main 2026-09-26. Każdy wpis ma odnośnik plik:linia do warunku w kodzie.
#
# Legenda: true = widoczne/dostępne, false = ukryte (trasa → ekran 403 z Guarded),
#          '?' = niejednoznaczne / prawdopodobny błąd → pytanie do właściciela.
# E = admin|logistics (canEdit). view_all_companies (flaga konta) opisana osobno.
roles: [admin, logistics, warehouse, forwarder, customs, purchasing]

# Ekran startowy po zalogowaniu (routing.tsx:85 homeFor)
home:
  admin: /pulpit
  logistics: /kolejka
  warehouse: /kolejka        # WarehouseQueuePage (App.tsx:148)
  forwarder: /pulpit
  customs: /kolejka          # renderuje CustomsPage (App.tsx:150)
  purchasing: /kolejka

# Trasy frontendu → dostęp (routing.tsx:48-80, App.tsx)
routes:
  /pulpit:                {admin: true, logistics: true, warehouse: false, forwarder: true, customs: false, purchasing: false}
  /kolejka:               {admin: true, logistics: true, warehouse: true, forwarder: true, customs: true, purchasing: true}
  /kolejka/archiwum:      {admin: true, logistics: true, warehouse: false, forwarder: true, customs: false, purchasing: false}
  /profil:                {admin: true, logistics: true, warehouse: true, forwarder: true, customs: true, purchasing: true}
  /wiedza:                {admin: true, logistics: true, warehouse: true, forwarder: true, customs: true, purchasing: true}
  /kontenery/:id:         {admin: true, logistics: true, warehouse: true, forwarder: true, customs: true, purchasing: true}   # bez guarda — zakres pilnuje API (404 dla obcego)
