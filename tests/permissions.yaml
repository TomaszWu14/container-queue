# Macierz uprawnień TIMPORYE: rola × trasa × metoda → oczekiwany wynik.
# Pilnuje: backend/tests/test_permissions_matrix.py (statycznie vs zależności + na żywo 403/401).
# Nowa trasa → szkic wpisu: `python ../tests/gen_permissions.py` z katalogu backend/.
#
# Legenda:
#   200 / '2xx'  — dostęp (dla '2xx' dokładny kod 200/201/204 ustali test w Etapie 2)
#   403          — rola odrzucona przez zależność
#   401          — anon (bez logowania)
#   public       — trasa świadomie publiczna (token w linku / logowanie / health)
#   komentarz „rola sprawdzana też w treści” — wynik ustalony testem na żywo (2026-09-26);
#     „brama: 404/422” = rola przepuszczona, ale handler odrzucił atrapę danych → zakres
#     na realnych rekordach sprawdzi test IDOR (Etap 2)
#
# Wymiary NIEUJĘTE w kolumnach (testowane osobno w Etapie 2):
#   * spółka: zasób innej spółki → 404 (IDOR), niezależnie od roli; admin i flaga
#     view_all_companies widzą wszystkie spółki (warehouse NIGDY — can_view_all)
#   * partnerzy (forwarder, customs) NIE mają osi spółki: company_id/view_all na ich koncie są
#     ignorowane (deps.own_company_id) — konta matrycy partnerów są bez spółki, jak na produkcji
#   * magazyn: konto warehouse zawężone do swojego magazynu (DLT/ACME)
#   * konto nieaktywne → 401; tryb podglądu admina („jako rola”) → mutacje 403
#   * 2xx zakłada poprawne dane wejściowe; walidacja (422) testowana osobno
