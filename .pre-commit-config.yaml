# Kontrole uruchamiane lokalnie przed każdym commitem: `pip install pre-commit && pre-commit install`.
# Łapią problemy (styl, błędy, sekrety, luki bezpieczeństwa) zanim trafią do repo.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff            # lint backendu (config: backend/pyproject.toml)
        args: ["--fix"]
        files: ^backend/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit          # SAST — luki bezpieczeństwa w kodzie backendu
        args: ["-c", "backend/pyproject.toml"]
        files: ^backend/app/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks        # skan sekretów (tokeny, hasła, DSN)
