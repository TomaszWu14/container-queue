# Brama HTTP: JEDNA domena firmowa, kilka niezależnych aplikacji na serwerze.
#
#   /n8n/...  → stack n8n           (docker-compose.n8n.yml, osobny cykl życia)
#   /         → panel TIMPORYE      (API + SPA z serwisu „app")
#
# Kolejna aplikacja = kolejny blok location (wzór na końcu pliku).
# Całość opisana w docs/N8N.md.

# DNS Dockera rozwiązujemy per żądanie (adres upstreamu w zmiennej), więc brama startuje
# także wtedy, gdy stack n8n jeszcze nie istnieje — wtedy tylko /n8n/ zwraca 502, panel
# działa normalnie. Ze statycznym proxy_pass nginx nie wstałby w ogóle („host not found").
resolver 127.0.0.11 ipv6=off valid=10s;

# WebSocket/SSE (edytor n8n, długie wykonania) — przepuszczamy Upgrade tylko wtedy,
# gdy klient go przysłał
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTPS kończy się na proxy Coolify; do bramy wchodzi HTTP, więc schemat bierzemy
# z nagłówka od Traefika, a gdy go brak — z własnego (dev/localhost)
map $http_x_forwarded_proto $forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

# OBS-005: access log BEZ tokenów. Linki publiczne (/avizo/<token>, /dostawa/…, /portal/…)
# i reset hasła (?token=) maskujemy jak redaction.redact_tokens w aplikacji; referera nie
# logujemy wcale (z publicznej strony niesie jej token). Test: test_brama_log_bez_tokenow.py
map $request_uri $safe_uri {
    "~^(?P<pre>/(api/)?(avizo/(driver/)?|public/portal/|public/containers/|driver/|dlt/|dostawa/|portal/))[A-Za-z0-9_-]{16,}" "${pre}[token]";
    "~^(?P<path>[^?]*)[?](.*&)?token=" "${path}?[token]";
    default $request_uri;
}

log_format bez_tokenow '$remote_addr [$time_local] "$request_method $safe_uri $server_protocol" '
                       '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log bez_tokenow;   # OBS-005 (stdout w obrazie nginx)

    # panel przyjmuje załączniki do MAX_UPLOAD_MB (domyślnie 25 MB), n8n do 16 MiB —
    # limit bramy musi być wyższy od obu, inaczej to ona odrzuci żądanie (413)
    client_max_body_size 32m;

    # healthcheck samej bramy (nie dotyka aplikacji)
    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- n8n: webhooki, formularze, MCP ---
    # BEZ przepisywania ścieżki: n8n sam serwuje /n8n/webhook/... (zmienne
    # N8N_ENDPOINT_* w docker-compose.n8n.yml), więc adres widziany przez klienta
    # i przez n8n jest IDENTYCZNY. To właśnie rewrite'y podścieżki psują podpisy
    # formularzy Human-in-the-Loop (n8n-io/n8n#19635) — dlatego ich tu nie ma.
    location /n8n/ {
        set $n8n_upstream http://n8n:5678;
        proxy_pass $n8n_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # workflow potrafi liczyć się długo, a formularz HITL czeka na człowieka
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;   # SSE/stream odpowiedzi bez buforowania
    }

    # --- panel TIMPORYE (domyślny cel) ---
    location / {
        set $panel_upstream http://app:8000;
        proxy_pass $panel_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # --- WZÓR: kolejna aplikacja pod tą samą domeną ---
    # Warunek: aplikacja musi serwować się pod TYM SAMYM prefiksem, pod którym ją
    # wystawiasz (u n8n robią to zmienne N8N_ENDPOINT_*). Jeśli umie tylko root,
    # zostaje jej dać własny prefiks w jej konfiguracji albo zrezygnować z prefiksu —
    # „strip prefix" psuje absolutne adresy jej assetów (/assets/... trafi do panelu).
    #
    # location /inna-apka/ {
    #     set $other_upstream http://inna-apka:3000;
    #     proxy_pass $other_upstream$request_uri;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # }
}
